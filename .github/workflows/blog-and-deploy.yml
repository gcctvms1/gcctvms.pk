name: Build blog and deploy

on:
  schedule:
    - cron: '0 4 * * *'        # every day at 04:00 UTC = 09:00 Pakistan time
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [contentful-publish] # optional: instant rebuild from a Contentful webhook
  push:
    branches: [main]            # redeploy whenever the site is changed

permissions:
  contents: write

concurrency:
  group: blog-and-deploy
  cancel-in-progress: false

env:
  SITE_DIR: gcctvms.pk                       # folder in this repo that holds the website
  SITE_URL: ${{ vars.SITE_URL || 'https://gcctvms.pk' }}
  HAS_CONTENTFUL: ${{ secrets.CONTENTFUL_SPACE_ID != '' && secrets.CONTENTFUL_DELIVERY_TOKEN != '' }}
  # FTP upload runs whenever the FTP_* secrets are set (set the variable USE_FTP = false to turn it off).
  HAS_FTP: ${{ vars.USE_FTP != 'false' && secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed to publish the live branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build blog from Contentful
        if: env.HAS_CONTENTFUL == 'true'
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
          CONTENTFUL_ENVIRONMENT: ${{ vars.CONTENTFUL_ENVIRONMENT || 'master' }}
          CONTENT_TYPE_ID: ${{ vars.CONTENT_TYPE_ID || 'blogPost' }}
        run: node scripts/build-blog.mjs

      - name: Skip blog build (Contentful secrets not set)
        if: env.HAS_CONTENTFUL != 'true'
        run: echo "::warning::CONTENTFUL_SPACE_ID / CONTENTFUL_DELIVERY_TOKEN secrets are not set, so the blog was not rebuilt."

      - name: Commit generated blog pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$SITE_DIR"
          if git diff --cached --quiet; then
            echo "No blog changes."
          else
            git commit -m "Blog: daily build $(date -u +%Y-%m-%d)"
            git push
          fi

      # Hostinger deploys from the "live" branch: the website folder only, at the top level.
      # Built with git subtree, so each deploy is a normal fast-forward commit.
      - name: Publish website to the live branch
        run: |
          git subtree split --prefix="$SITE_DIR" -b live
          git push origin live

      # Accept the FTP address in any common form (ftp://host, host:21, host/path, extra spaces)
      # and check that it resolves before uploading.
      - name: Check FTP server address
        id: ftp
        if: env.HAS_FTP == 'true'
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          host="$(printf '%s' "$RAW_SERVER" | tr -d '[:space:]')"
          host="${host#*://}"; host="${host%%/*}"
          port=21
          case "$host" in *:*) port="${host##*:}"; host="${host%%:*}";; esac
          user="$(printf '%s' "$RAW_USER" | tr -d '[:space:]')"
          echo "::add-mask::$host"; echo "::add-mask::$user"
          if ! getent hosts "$host" >/dev/null; then
            echo "::error::FTP_SERVER does not resolve to a server. In hPanel > Files > FTP Accounts, copy the FTP IP or hostname (for example ftp.gcctvmspk.com) into the FTP_SERVER secret."
            exit 1
          fi
          {
            echo "host=$host"
            echo "port=$port"
            echo "user=$user"
          } >> "$GITHUB_OUTPUT"

      - name: Upload website to Hostinger (FTP)
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          port: ${{ steps.ftp.outputs.port }}
          username: ${{ steps.ftp.outputs.user }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./gcctvms.pk/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

